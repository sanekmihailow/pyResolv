[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyresolv"
version = "2.7.0"
description = "Process firewall logs with a set of filter stages (collect/trim/merge/aggregate/resolve)"
requires-python = ">=3.10"
dependencies = [
    "pandas==3.0.3",
    "tqdm==4.67.3",
    "requests",
    "pydantic-settings",
    "PyYAML",
    "ipwhois",
]

[project.optional-dependencies]
# Translation tooling (extract/update .po). Compiling .mo does not need Babel —
# that is done by the bundled tools/msgfmt.py.
i18n = ["babel"]
# Local MaxMind GeoLite2 lookups for the geo_maxmind resolver.
geo = ["geoip2"]
# Redis backend for the persistent resolve cache (RESOLVE__CACHE=redis).
redis = ["redis"]

[project.scripts]
pyresolv = "pyresolv.cli:main"

[tool.setuptools.packages.find]
include = ["pyresolv*"]

[tool.setuptools.package-data]
# Compiled translation catalogs must ship with the package.
pyresolv = ["locale/*/LC_MESSAGES/*.mo"]
